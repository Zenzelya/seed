services:
  db:
    image: postgres:15
    restart: unless-stopped
    container_name: anki-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: anki
    ports:
      - "5432:5432"
    volumes:
      - anki-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anki"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["api"]

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: anki-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - anki-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    profiles: ["api"]

  api:
    container_name: anki-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    ports:
      - "3000:3000"
      - "9230:9230"
    volumes:
      - ./backend:/app
      - ./backend/data:/data:ro
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:dev"]
    profiles: ["api"]

  front:
    container_name: anki-front
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    profiles: [ "front" ]

  fast:
    container_name: anki-fast
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/parser.Dockerfile
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./parser:/app
      - ./backend/data:/data:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    profiles: [ "api" ]

volumes:
  anki-db-data:
  anki-redis-data:
