# generated by lib-ports.sh — не редактировать вручную
# для пересборки: bin/reset-ports.sh
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  api:
    restart: unless-stopped
    shm_size: '256m'
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /app
    ports:
      - "${API_PORT}:3000"
      - "${API_DEBUG_PORT}:9230"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - ./backend/data:/data:ro
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    command: ["npm", "run", "start:dev"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  front:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /app
    ports:
      - "${FRONT_PORT}:4200"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    command: ["npm", "start"]

volumes:
  db-data:
  redis-data:
  api_node_modules:
  front_node_modules:
