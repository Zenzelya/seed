  front:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /app
    ports:
      - "${FRONT_PORT}:3000"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
      - front_next:/app/.next
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    command: ["npm", "run", "dev"]
